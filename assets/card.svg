<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340" role="img" aria-labelledby="title desc">
  <title id="title">sn0w12 profile card</title>
  <desc id="desc">Terminal-style profile card with a profile, stack, and setup section.</desc>
  <rect x="0.5" y="0.5" width="539" height="339" rx="12" fill="#1f1f28" stroke="#54546d" />
  <g font-family="'DejaVu Sans Mono', 'Liberation Mono', Menlo, Consolas, monospace" font-size="16" xml:space="preserve">
    <text x="24" y="44" fill="#957fb8">╭─ sn0w12</text>
    <text x="24" y="66"><tspan fill="#957fb8">├─ focus     </tspan><tspan fill="#dcd7ba">desktop apps and developer tools</tspan></text>
    <text x="24" y="88"><tspan fill="#957fb8">╰─ building  </tspan><tspan fill="#dcd7ba">gitau</tspan></text>

    <text x="24" y="132" fill="#c0a36e">╭─ stack</text>
    <text x="24" y="154"><tspan fill="#c0a36e">├─ languages </tspan><tspan fill="#dcd7ba">Rust, TypeScript, Python</tspan></text>
    <text x="24" y="176"><tspan fill="#c0a36e">╰─ web       </tspan><tspan fill="#dcd7ba">React, TanStack Start</tspan></text>

    <text x="24" y="220" fill="#76946a">╭─ setup</text>
    <text x="24" y="242"><tspan fill="#76946a">├─ os        </tspan><tspan fill="#dcd7ba">Pond x86_64</tspan></text>
    <text x="24" y="264"><tspan fill="#76946a">├─ wm        </tspan><tspan fill="#dcd7ba">niri</tspan></text>
    <text x="24" y="286"><tspan fill="#76946a">├─ cpu       </tspan><tspan fill="#dcd7ba">i7-14700K</tspan></text>
    <text x="24" y="308"><tspan fill="#76946a">╰─ gpu       </tspan><tspan fill="#dcd7ba">RTX 3090</tspan></text>
  </g>
</svg>
